<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schloss Drehna Spot</title>
<style>
  @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 400; src: url(fonts/PlayfairDisplay-Regular.ttf) format('truetype'); }
  @font-face { font-family: 'Playfair Display'; font-style: italic; font-weight: 400; src: url(fonts/PlayfairDisplay-Italic.ttf) format('truetype'); }
  @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 700; src: url(fonts/PlayfairDisplay-Bold.ttf) format('truetype'); }
  @font-face { font-family: 'Permanent Marker'; font-style: normal; font-weight: 400; src: url(fonts/PermanentMarker-Regular.ttf) format('truetype'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300; src: url(fonts/Inter-Light.ttf) format('truetype'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; src: url(fonts/Inter-SemiBold.ttf) format('truetype'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 800; src: url(fonts/Inter-ExtraBold.ttf) format('truetype'); }

  :root { --bg: #05070d; --fg: #f6eedd; --gold: #e8b04a; --muted: #8f8a80; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  .stage { position: relative; width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  canvas { width: 100%; height: 100%; display: block; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle, rgba(5,7,13,.35), rgba(5,7,13,.85)); cursor: pointer; transition: opacity .4s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .play { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .play .btn { width: 92px; height: 92px; border-radius: 50%; border: 2px solid var(--gold); display: grid; place-items: center; }
  .play .btn::after { content: ''; margin-left: 8px; border-left: 28px solid var(--gold); border-top: 17px solid transparent; border-bottom: 17px solid transparent; }
  .play span { letter-spacing: .3em; font-size: 12px; font-weight: 600; color: var(--gold); text-transform: uppercase; }
  .bar { width: min(100%, calc((100vh - 120px) * 16 / 9)); display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar button { background: none; border: 1px solid #333; color: var(--fg); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .bar button:hover { border-color: var(--gold); }
  input[type=range] { flex: 1; accent-color: var(--gold); }
  @media (max-width: 600px) { .bar { flex-wrap: wrap; } }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="c" width="1920" height="1080"></canvas>
    <div class="overlay" id="ov"><div class="play"><div class="btn"></div><span id="status">Composing soundtrack…</span></div></div>
  </div>
  <div class="bar">
    <button id="pp">Play</button>
    <input id="scrub" type="range" min="0" max="30" step="0.01" value="0">
    <span id="tc">00:00.00</span>
    <button id="wav" title="Download the generated soundtrack">WAV</button>
  </div>
<script src="spot.js"></script>
<script src="audio.js"></script>
<script>
(async () => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const ov = document.getElementById('ov'), status = document.getElementById('status');
  const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  await Promise.all(Spot.fonts.map(f => document.fonts.load(f)));
  let t = 0, playing = false, ac = null, src = null, startAt = 0, startT = 0;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(2).padStart(5, '0')}`;
  const draw = () => { Spot.render(ctx, t); scrub.value = t; tc.textContent = fmt(t); };
  t = 3.5; draw(); t = 0;

  const buffer = await SpotAudio.render();
  status.textContent = 'Play · 30″ · sound on';

  function play() {
    if (!ac) ac = new AudioContext();
    if (t >= Spot.DURATION - 0.05) t = 0;
    src = ac.createBufferSource(); src.buffer = buffer; src.connect(ac.destination);
    startAt = ac.currentTime + 0.05; startT = t; src.start(startAt, t);
    playing = true; pp.textContent = 'Pause'; ov.classList.add('hidden');
    requestAnimationFrame(loop);
  }
  function pause() { if (src) { src.stop(); src = null; } playing = false; pp.textContent = 'Play'; }
  function loop() {
    if (!playing) return;
    t = Math.max(0, startT + ac.currentTime - startAt);
    if (t >= Spot.DURATION) { t = Spot.DURATION - 0.001; draw(); pause(); ov.classList.remove('hidden'); return; }
    draw(); requestAnimationFrame(loop);
  }
  ov.onclick = play;
  pp.onclick = () => (playing ? pause() : play());
  scrub.oninput = () => { const was = playing; pause(); t = +scrub.value; draw(); if (was) play(); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
  document.getElementById('wav').onclick = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([SpotAudio.toWav(buffer)], { type: 'audio/wav' }));
    a.download = 'schloss-drehna-soundtrack.wav'; a.click();
  };
})();
</script>
</body>
</html>
